        <section class="rightside">

                <div class="input-row">





                    <div class="input-card">
                        <label>Nome Completo</label>
                        <input placeholder="Ex: pedro gameplays">
                    </div>


                    <div class="input-card">
                        <label>CPF</label>
                        <input placeholder="Ex: 000.000.000-00">
                    </div>


                </div>

                <div class="input-row">


                    <div class="input-card">
                        <label>Email</label>

                    </div>

                    <div class="input-card">
                        <label>Telefone</label>

                    </div>

                <div class="input-row">

                    <div class="input-card">
                        <label>Data de Nascimento</label>

                    </div>

                    <div class="input-card">
                        <label>Data de Contratação</label>
                        <input type="date">
                    </div>




                    <div class="input-card">
                        <label>Cargo</label>
                        <div class="input-div">
                            <select id="cargo">
                                <option>Junior</option>
                                <option>senrio</option>
                                <option>pleno</option>
                                <option>gestor</option>
                                <option>ceo</option>
                            </select>
                        </div>
                    </div>


                    <div class="input-card">
                        <label>Departamento</label>
                        <div class="input-div">
                            <select id="departamento">
                                <option>Rh</option>
                                <option>Financeiro</option>
                                <option>suprimentos</option>
                                <option>Orçamento</option>
                                <option>RelCli</option>
                            </select>
                        </div>
                    </div>

                </div>


                <div class="input-card">
                    <label>Status</label>
                    <div class="input-div">
                        <select id="status">
                            <option>Ativo</option>
                            <option>Inativo</option>
                            <option>Afastado</option>
                        </select>
                    </div>
                </div>

                </div>
